{{- partial "music.html" . -}}

<div id="sakana-widget-container" aria-hidden="true">
  <div id="sakana-widget"></div>
</div>
<script>
  (function () {
    function checkScreenWidth() {
      var container = document.getElementById('sakana-widget-container');
      if (container && window.innerWidth <= 960) {
        container.style.display = 'none';
      }
    }

    window.initSakanaWidget = function () {
      var target = document.getElementById('sakana-widget');
      if (!target || typeof SakanaWidget === 'undefined' || target.dataset.mounted === 'true') {
        checkScreenWidth();
        return;
      }
      target.dataset.mounted = 'true';
      new SakanaWidget({
        size: 300,
        autoFit: true,
        character: 'chisato',
        controls: true,
        rod: true,
        draggable: true,
        stroke: { color: '#b4b4b4', width: 10 },
        threshold: 0.1,
        rotate: 0,
        title: false
      }).mount('#sakana-widget');
      checkScreenWidth();
      window.addEventListener('resize', checkScreenWidth);
    };
  })();
</script>
<script async onload="window.initSakanaWidget && window.initSakanaWidget()"
  src="https://cdn.jsdelivr.net/npm/sakana-widget@3.0.0/lib/index.umd.min.js">
</script>
